<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Cuidalia</title>
  <base href="/">

  <!-- ⭐ VIEWPORT & COLOR SCHEME - PREVENCIÓN ESTRICTA DE MODO OSCURO FORZADO -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta name="theme-color" content="#520D2F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- ⭐ FONT AWESOME - VERSIÓN 6.5.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ⭐ LEAFLET -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <!-- ⭐ GOOGLE FONTS -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- ⭐ SOCKET.IO -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

  <!-- ⭐ TOASTIFY -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- ⭐ FAVICON Y PWA ICONS CUIDALIA -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
  <link rel="icon" type="image/png" href="cuidalia-logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#520D2F">
  <meta name="apple-mobile-web-app-title" content="Cuidalia">
  <meta name="application-name" content="Cuidalia">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
</head>

<body>
  <app-root>
    <div
      style="position: fixed; inset: 0; background: linear-gradient(135deg, #7A192B 0%, #520D2F 50%, #38061F 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;">
      <div
        style="background: #ffffff; border-radius: 28px; padding: 26px 36px; box-shadow: 0 16px 50px rgba(0,0,0,0.45); display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 84vw; border: 2.5px solid #FF6B55;">
        <img src="cuidalia-casa-cuidados.png" alt="Cuidalia" style="width: 115px; height: auto;" />
        <img src="cuidalia-wordmark.png" alt="Cuidalia" style="width: 175px; height: auto;" />
        <span style="font-size: 11px; font-weight: 800; color: #7A192B; letter-spacing: 1.5px;">CERCANÍA QUE
          CUIDA</span>
      </div>
      <div
        style="margin-top: 26px; display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 700;">
        <div
          style="width: 18px; height: 18px; border: 2.5px solid #FF6B55; border-top-color: transparent; border-radius: 50%; animation: pwaPreSpin 0.8s linear infinite;">
        </div>
        <span>Iniciando Cuidalia...</span>
      </div>
    </div>
    <style>
      @keyframes pwaPreSpin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </app-root>
  <noscript>Por favor active JavaScript para utilizar Cuidalia.</noscript>
</body>

</html>
